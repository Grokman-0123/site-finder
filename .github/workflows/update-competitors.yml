name: Update competitor data

on:
  schedule:
    - cron: "17 3 * * 1"   # Mondays 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-competitors.yml"
      - "scripts/build_competitors.py"

permissions:
  contents: write

concurrency:
  group: update-competitors
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get the build script
        uses: actions/checkout@v4
        with:
          path: src

      - name: Get the published site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install osmium
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool

      - name: Download tyre shops, garages and car washes in Sweden
        run: python src/scripts/build_competitors.py site/competitors.json

      - name: Publish if changed
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add competitors.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update competitor data"
            git pull --rebase origin gh-pages
            git push origin gh-pages
          fi
