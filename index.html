<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Site Finder: car businesses in Sweden</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#111;--mut:#666;--rule:#ddd;--soft:#f3f3f3;--red:#e4002b;--blue:#1f5fbf}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{font:16px/1.45 Archivo,system-ui,sans-serif;color:var(--ink);background:var(--bg);display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
header{padding:10px max(12px,env(safe-area-inset-left)) 10px;border-top:6px solid var(--ink);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:max(10px,env(safe-area-inset-top))}
h1{font-stretch:112%;font-weight:800;font-size:20px;margin:0 8px 0 0;white-space:nowrap}
form{display:flex;flex:1 1 260px;gap:6px}
input,select,button{font:inherit;font-size:16px;min-height:44px;border:2px solid var(--ink);background:var(--bg);color:var(--ink);padding:0 10px;border-radius:0}
input[type=search]{flex:1}
button{cursor:pointer;font-weight:600}
button.on{background:var(--ink);color:var(--bg)}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.app{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 380px}
#map{height:100%;min-height:300px}
aside{border-left:3px solid var(--ink);overflow-y:auto;padding:14px 16px 24px;background:var(--bg)}
.layers{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.layers button{font-size:14px;min-height:40px;padding:0 10px}
h2{font-stretch:112%;font-weight:800;font-size:22px;line-height:1.15;margin:4px 0 6px}
h3{font-size:15px;margin:16px 0 6px;padding-top:8px;border-top:2px solid var(--ink)}
.big{font-stretch:125%;font-weight:800;font-size:44px;line-height:1;color:var(--red)}
.row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--rule);padding:6px 0;font-size:15px}
.row b{white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.note{font-size:13px;color:var(--mut)}
.status{font-size:13px;color:var(--mut);min-height:1.4em}
.meter{height:8px;background:var(--soft);margin-top:3px}.meter i{display:block;height:100%;background:var(--red)}
.key{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;margin:6px 0}
.key span{display:inline-flex;align-items:center;gap:5px}
.sw{display:inline-block;width:18px;height:5px}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #0004}
ol{padding-left:1.2em;margin:6px 0}li{margin:3px 0;font-size:15px}
.sheet-handle{display:none}
dialog{border:3px solid var(--ink);max-width:min(92vw,460px);padding:18px}
dialog::backdrop{background:#0006}
.leaflet-container{font:inherit}
@media(max-width:820px){
 .app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
 aside{border-left:0;border-top:3px solid var(--ink);height:44vh;padding-bottom:max(24px,env(safe-area-inset-bottom))}
 aside.min{height:120px}
 .sheet-handle{display:block;width:100%;min-height:28px;border:0;background:none;padding:0;margin:-8px 0 4px}
 .sheet-handle::before{content:"";display:block;width:44px;height:5px;background:#bbb;margin:0 auto;border-radius:3px}
 h1{display:none}
 header{gap:6px}
 #biz{flex:1 1 100%}
}
</style>
</head>
<body>
<header>
  <h1>Site Finder</h1>
  <form id="search"><input type="search" id="q" placeholder="Search an address or town" aria-label="Search an address or town" autocomplete="off"><button>Go</button></form>
  <select id="biz" aria-label="Business type">
    <option value="tyre">Tyre shop</option><option value="mech">Car mechanic</option><option value="wash">Car wash and care</option>
  </select>
</header>
<div class="app">
  <div id="map"></div>
  <aside id="panel">
    <button class="sheet-handle" id="handle" aria-label="Expand or collapse panel"></button>
    <div class="layers" role="group" aria-label="Map layers">
      <button id="L-comp" class="on" aria-pressed="true">Competitors</button>
      <button id="L-road" class="on" aria-pressed="true">Road traffic</button>
      <button id="L-kom" aria-pressed="false">Municipality score</button>
      <button id="L-tv" aria-pressed="false">Measured traffic</button>
    </div>
    <div class="status" id="status" role="status"></div>
    <div id="out"></div>
  </aside>
</div>

<dialog id="tvdlg">
  <h2>Trafikverket traffic counts</h2>
  <p>Measured traffic comes from Trafikverket's open API, which needs a free key. Register at <b>api.trafikinfo.trafikverket.se</b>, create a key, and paste it here. It's saved only in this browser.</p>
  <form method="dialog" id="tvform" style="display:grid;gap:8px">
    <input id="tvkey" placeholder="Your API key" autocomplete="off" aria-label="Trafikverket API key">
    <div style="display:flex;gap:8px"><button value="save">Save and show</button><button value="cancel" formnovalidate>Cancel</button></div>
  </form>
</dialog>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
{
const $=id=>document.getElementById(id);
const fmt=n=>n==null||isNaN(n)?"–":Math.round(n).toLocaleString("sv-SE");
const OVERPASS=["https://overpass-api.de/api/interpreter","https://overpass.private.coffee/api/interpreter","https://maps.mail.ru/osm/tools/overpass/api/interpreter"];
const BIZ={
 tyre:{name:"tyre shop",main:['nwr["shop"="tyres"]','nwr["service:vehicle:tyres"="yes"]'],side:['nwr["shop"="car_repair"]','nwr["craft"="car_repair"]'],mainL:"Tyre shops",sideL:"Garages (many also fit tyres)"},
 mech:{name:"car mechanic",main:['nwr["shop"="car_repair"]','nwr["craft"="car_repair"]'],side:['nwr["shop"="tyres"]'],mainL:"Garages",sideL:"Tyre shops"},
 wash:{name:"car wash",main:['nwr["amenity"="car_wash"]'],side:['nwr["shop"="car"]["service:vehicle:car_wash"="yes"]'],mainL:"Car washes",sideL:"Dealers with car wash"}};
// Typical Swedish traffic by road class (vehicles per day). Rough guides, not measurements.
const ROAD={motorway:{l:"Motorway",adt:"20 000–80 000",v:1,c:"#7a0019",w:6},trunk:{l:"Major road",adt:"8 000–30 000",v:.85,c:"#c4001f",w:5},
 primary:{l:"Main road",adt:"4 000–15 000",v:.7,c:"#f05a28",w:4},secondary:{l:"Secondary road",adt:"1 500–6 000",v:.5,c:"#f5a623",w:3},
 tertiary:{l:"Local through-road",adt:"500–3 000",v:.3,c:"#f2d06b",w:2},residential:{l:"Residential street",adt:"under 500",v:.1,c:"#bbb",w:1},unclassified:{l:"Minor road",adt:"under 500",v:.12,c:"#bbb",w:1}};
["motorway","trunk","primary","secondary","tertiary"].forEach(k=>ROAD[k+"_link"]={...ROAD[k],l:ROAD[k].l+" ramp",v:ROAD[k].v*.8});
let biz="tyre",site=null,tvKey="";try{tvKey=localStorage.getItem("tvkey")||""}catch(e){}
const map=L.map("map",{zoomControl:true,preferCanvas:true}).setView([59.33,18.06],12);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);
const G={comp:L.layerGroup().addTo(map),road:L.layerGroup().addTo(map),kom:L.layerGroup(),tv:L.layerGroup(),site:L.layerGroup().addTo(map)};
const on={comp:true,road:true,kom:false,tv:false};
const status=t=>$("status").textContent=t||"";

// One request at a time (public servers allow ~2 per visitor), 15 s timeout per server, fall through mirrors.
let opChain=Promise.resolve(),opStart=0;
async function opOnce(q){let err;for(let i=0;i<OVERPASS.length;i++){const u=OVERPASS[(opStart+i)%OVERPASS.length];const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),15000);
  try{const r=await fetch(u,{method:"POST",body:"data="+encodeURIComponent(q),headers:{"Content-Type":"application/x-www-form-urlencoded"},signal:ac.signal});clearTimeout(tm);
    if(r.ok){const d=await r.json();if(d&&d.elements){opStart=(opStart+i)%OVERPASS.length;return d}}err=new Error("HTTP "+r.status)}catch(e){clearTimeout(tm);err=e}}throw err||new Error("No server answered")}
function overpass(q){const run=opChain.then(()=>opOnce(q));opChain=run.catch(()=>{});return run}
const bboxStr=b=>`${b.getSouth().toFixed(4)},${b.getWest().toFixed(4)},${b.getNorth().toFixed(4)},${b.getEast().toFixed(4)}`;
const ll=e=>e.center?[e.center.lat,e.center.lon]:[e.lat,e.lon];
function compQuery(area){const B=BIZ[biz];return `[out:json][timeout:25];(${B.main.map(s=>s+area+";").join("")})->.m;(${B.side.map(s=>s+area+";").join("")})->.s;.m out center tags;.s out center tags;`}
// Overpass returns .m then .s; tag each element by matching selectors client-side
function isMain(t){if(biz==="tyre")return t.shop==="tyres"||t["service:vehicle:tyres"]==="yes";if(biz==="mech")return t.shop==="car_repair"||t.craft==="car_repair";return t.amenity==="car_wash"}
function addr(t){return [t["addr:street"]&&(t["addr:street"]+" "+(t["addr:housenumber"]||"")).trim(),t["addr:city"]].filter(Boolean).join(", ")}

let viewCache=new Map(),lastComp=[],gen=0;
function roadClasses(z){return z>=14?"motorway|trunk|primary|secondary|tertiary|motorway_link|trunk_link|primary_link":z>=12?"motorway|trunk|primary|secondary":"motorway|trunk|primary"}
async function loadView(){
  const my=++gen;G.comp.clearLayers();G.road.clearLayers();const z=map.getZoom();
  if(z<11){status("Zoom in to a town to see competitors and traffic.");return}
  if(!on.comp&&!on.road)return;
  const b=map.getBounds().pad(.1),bb=bboxStr(b),cls=roadClasses(z),key=biz+cls+bb+on.comp+on.road;
  const q=`[out:json][timeout:25];`+(on.comp?compQuery(`(${bb})`).replace("[out:json][timeout:25];",""):"")+(on.road&&z>=11?`way["highway"~"^(${cls})$"](${bb});out geom tags;`:"");
  status("Loading map data…");
  let d=viewCache.get(key);
  if(!d){try{d=await overpass(q)}catch(e){if(my===gen)status("");if(my===gen)showRetry("The free map-data server is busy.",loadView);return}viewCache.set(key,d)}
  if(my!==gen)return;
  const seen=new Set(),els=d.elements.filter(e=>{const id=e.type+e.id;if(seen.has(id))return false;seen.add(id);return true});
  els.filter(e=>e.tags&&e.tags.highway&&e.geometry).forEach(w=>{const r=ROAD[w.tags.highway];if(r)L.polyline(w.geometry.map(g=>[g.lat,g.lon]),{color:r.c,weight:r.w,opacity:.85,interactive:false}).addTo(G.road)});
  lastComp=els.filter(e=>!(e.tags&&e.tags.highway)).map(e=>({p:ll(e),t:e.tags||{},main:isMain(e.tags||{})}));
  lastComp.sort((x,y)=>x.main-y.main).forEach(c=>{const m=L.circleMarker(c.p,{radius:c.main?8:5,color:"#fff",weight:2,fillColor:c.main?"#e4002b":"#555",fillOpacity:.95});
    m.bindPopup(`<b>${c.t.name||"Unnamed"}</b><br>${c.main?BIZ[biz].mainL.replace(/s$/,""):BIZ[biz].sideL.replace(/ \(.*/,"").replace(/s$/,"")}${addr(c.t)?"<br>"+addr(c.t):""}${c.t.opening_hours?"<br><span style='color:#666'>"+c.t.opening_hours+"</span>":""}`);m.addTo(G.comp)});
  const nm=lastComp.filter(c=>c.main).length;status(on.comp?`${nm} ${BIZ[biz].mainL.toLowerCase()} and ${lastComp.length-nm} related businesses in view.`:"");
}
function showRetry(msg,fn){const id="rt"+Date.now();$("status").innerHTML=`${msg} <button id="${id}" style="min-height:36px;font-size:14px;margin-left:6px">Try again</button>`;$(id).onclick=fn}
const loadComp=loadView,loadRoads=loadView;
// Municipality layer with SCB data
let kom=null,komScore={};
function pctFn(vals,inv){const v=vals.filter(x=>x!=null).sort((a,b)=>a-b);return x=>{if(x==null)return .5;let i=0;while(i<v.length&&v[i]<x)i++;const p=i/(v.length-1);return inv?1-p:p}}
function scoreKom(){if(!kom)return;const P=kom.features.map(f=>f.properties);P.forEach(p=>p.dens=p.cars/p.pop*1000);
  const W=biz==="wash"?{cars:4,dens:1,inc:5,cost:1}:biz==="mech"?{cars:5,dens:3,inc:1,cost:4}:{cars:5,dens:4,inc:2,cost:3};
  const f={cars:pctFn(P.map(p=>p.cars)),dens:pctFn(P.map(p=>p.dens)),inc:pctFn(P.map(p=>p.inc)),cost:pctFn(P.map(p=>p.hps),true)};
  P.forEach(p=>{let s=0,t=0;for(const k in W){s+=W[k]*f[k](k==="cost"?p.hps:p[k]);t+=W[k]}komScore[p.c]=s/t*100})}
function komColor(s){const t=Math.max(0,Math.min(1,(s-30)/50));return `rgba(228,0,43,${.08+t*.55})`}
function drawKom(){G.kom.clearLayers();if(!on.kom||!kom)return;L.geoJSON(kom,{style:f=>({color:"#111",weight:1,fillColor:komColor(komScore[f.properties.c]),fillOpacity:.6}),interactive:false}).addTo(G.kom)}
function inPoly(pt,ring){let x=pt[1],y=pt[0],c=false;for(let i=0,j=ring.length-1;i<ring.length;j=i++){const[xi,yi]=ring[i],[xj,yj]=ring[j];if((yi>y)!=(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)c=!c}return c}
function komAt(p){if(!kom)return null;return kom.features.find(f=>f.geometry.coordinates.some(poly=>inPoly(p,poly[0])))?.properties||null}
fetch("kommuner.json").then(r=>r.json()).then(d=>{kom=d;scoreKom();drawKom();if(site)checkSite(site)}).catch(()=>{});
// Trafikverket measured flow
async function loadTV(){G.tv.clearLayers();if(!on.tv||!tvKey)return;if(map.getZoom()<9){status("Zoom in to see measured traffic.");return}
  const b=map.getBounds();const xml=`<REQUEST><LOGIN authenticationkey="${tvKey.replace(/[^\w-]/g,"")}"/><QUERY objecttype="TrafficFlow" schemaversion="1.4" limit="500"><FILTER><WITHIN name="Geometry.WGS84" shape="box" value="${b.getWest()} ${b.getSouth()}, ${b.getEast()} ${b.getNorth()}"/></FILTER></QUERY></REQUEST>`;
  try{const r=await fetch("https://api.trafikinfo.trafikverket.se/v2/data.json",{method:"POST",headers:{"Content-Type":"text/xml"},body:xml});const d=await r.json();
    const items=d?.RESPONSE?.RESULT?.[0]?.TrafficFlow||[];if(d?.RESPONSE?.RESULT?.[0]?.ERROR)throw new Error(d.RESPONSE.RESULT[0].ERROR.MESSAGE);
    const bySite=new Map();items.forEach(i=>{const m=/POINT \(([-\d.]+) ([-\d.]+)\)/.exec(i.Geometry?.WGS84||"");if(!m)return;const k=i.SiteId||m[0];const o=bySite.get(k)||{p:[+m[2],+m[1]],flow:0,spd:i.AverageVehicleSpeed,t:i.MeasurementTime};o.flow+=+i.VehicleFlowRate||0;bySite.set(k,o)});
    bySite.forEach(s=>L.circleMarker(s.p,{radius:7+Math.min(10,s.flow/400),color:"#fff",weight:2,fillColor:"#1f5fbf",fillOpacity:.9}).bindPopup(`<b>${fmt(s.flow)} vehicles/hour</b> right now<br>Average speed ${fmt(s.spd)} km/h<br><span style="color:#666">Trafikverket sensor, ${(s.t||"").slice(0,16).replace("T"," ")}</span>`).addTo(G.tv));
    status(bySite.size?`${bySite.size} Trafikverket sensors in view.`:"No Trafikverket sensors in this area. They sit mostly on big roads around larger cities.");
  }catch(e){status("Trafikverket didn't answer: check your API key. "+(e.message||""))}}
// Site check
const dist=(a,b)=>{const R=6371e3,r=Math.PI/180,dl=(b[0]-a[0])*r,dn=(b[1]-a[1])*r;const h=Math.sin(dl/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
function segDist(p,a,b){const k=Math.cos(p[0]*Math.PI/180),ax=(a[1]-p[1])*k,ay=a[0]-p[0],bx=(b[1]-p[1])*k,by=b[0]-p[0],dx=bx-ax,dy=by-ay;const t=Math.max(0,Math.min(1,-(ax*dx+ay*dy)/((dx*dx+dy*dy)||1e-12)));return Math.hypot(ax+t*dx,ay+t*dy)*111320}
const km=m=>m<1000?Math.round(m/10)*10+" m":(m/1000).toFixed(1).replace(".",",")+" km";
async function checkSite(p){
  site=p;G.site.clearLayers();
  L.circle(p,{radius:1000,color:"#111",weight:1.5,fill:false,dashArray:"4 6",interactive:false}).addTo(G.site);
  L.circle(p,{radius:3000,color:"#111",weight:1,fill:false,dashArray:"2 8",interactive:false}).addTo(G.site);
  L.circleMarker(p,{radius:9,color:"#111",weight:3,fillColor:"#fff",fillOpacity:1}).addTo(G.site);
  if($("panel").classList.contains("min")){$("panel").classList.remove("min");setTimeout(()=>{map.invalidateSize();map.panTo(p)},50)}$("out").innerHTML=`<p class="note">Checking this spot…</p>`;
  const B=BIZ[biz];let comps=[],roads=[],place="";
  const area=`(around:3000,${p[0]},${p[1]})`;
  try{const q=compQuery(area)+`way["highway"~"^(motorway|trunk|primary|secondary|tertiary|motorway_link|trunk_link|primary_link|secondary_link|residential|unclassified)$"](around:300,${p[0]},${p[1]});out geom tags;`;
    const geo=fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&lat=${p[0]}&lon=${p[1]}`).then(x=>x.json()).catch(()=>null);
    const all=await overpass(q),g=await geo;
    const seen=new Set(),els=all.elements.filter(e=>{const id=e.type+e.id;if(seen.has(id))return false;seen.add(id);return true});
    comps=els.filter(e=>!(e.tags&&e.tags.highway)).map(e=>({p:ll(e),t:e.tags||{},main:isMain(e.tags||{})})).map(x=>({...x,d:dist(p,x.p)})).sort((a,b)=>a.d-b.d);
    roads=els.filter(w=>w.tags&&ROAD[w.tags.highway]&&w.geometry).map(w=>{let d=1e9;for(let i=1;i<w.geometry.length;i++){const a=w.geometry[i-1],b=w.geometry[i];d=Math.min(d,segDist(p,[a.lat,a.lon],[b.lat,b.lon]))}return{t:w.tags,r:ROAD[w.tags.highway],d}});
    if(g&&g.address){const a=g.address;place=[[a.road,a.house_number].filter(Boolean).join(" "),a.city||a.town||a.village||a.municipality].filter(Boolean).join(", ")}
  }catch(e){$("out").innerHTML=`<p>The free map-data server is busy right now.</p><button id="siteRetry">Check this spot again</button>`;$("siteRetry").onclick=()=>checkSite(p);return}
  const main=comps.filter(c=>c.main),m1=main.filter(c=>c.d<=1000).length,m3=main.length,s3=comps.length-m3;
  // traffic: best road weighted by distance (frontage within ~60 m counts fully)
  let best=null;roads.forEach(x=>{const eff=x.r.v*(x.d<=60?1:x.d<=150?.6:.3);if(!best||eff>best.eff)best={...x,eff}});
  const nearest=roads.slice().sort((a,b)=>a.d-b.d)[0];
  const k=komAt(p),ks=k?komScore[k.c]:null;
  const tScore=best?best.eff:0, cScore=Math.max(0,1-(m1*.25+m3*.07)), dScore=ks!=null?ks/100:.5;
  const total=Math.round((tScore*.4+cScore*.35+dScore*.25)*100);
  $("out").innerHTML=`
   <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:10px"><div><h2>${place||"Selected spot"}</h2><div class="note">${k?k.n+" municipality · ":""}scored as a ${B.name}</div></div><div class="big" title="Site score out of 100">${total}</div></div>
   <h3>Traffic past the door</h3>
   ${best?`<div class="row"><span>Busiest road within 300 m</span><b>${best.t.name||best.t.ref||best.r.l}</b></div><div class="row"><span>Road type</span><b>${best.r.l}${best.t.ref?" ("+best.t.ref+")":""}</b></div><div class="row"><span>Typical traffic</span><b>${best.r.adt} vehicles/day</b></div><div class="row"><span>Distance to it</span><b>${km(best.d)}</b></div>`:`<p>No through-roads within 300 m. Expect little passing traffic.</p>`}
   ${nearest&&best&&nearest.t!==best.t?`<div class="row"><span>Nearest street</span><b>${nearest.t.name||nearest.r.l}</b></div>`:""}
   <div class="meter"><i style="width:${Math.round(tScore*100)}%"></i></div>
   <p class="note">Daily traffic is a typical range for this kind of Swedish road, not a count. Turn on Measured traffic for live Trafikverket sensors, or check the exact yearly figure in Trafikverket's Vägtrafikflödeskarta.</p>
   <h3>Competition</h3>
   <div class="row"><span>${B.mainL} within 1 km</span><b>${m1}</b></div>
   <div class="row"><span>${B.mainL} within 3 km</span><b>${m3}</b></div>
   <div class="row"><span>${B.sideL} within 3 km</span><b>${s3}</b></div>
   <div class="row"><span>Nearest ${B.name}</span><b>${main[0]?km(main[0].d):"none within 3 km"}</b></div>
   ${main.length?`<ol>${main.slice(0,5).map(c=>`<li>${c.t.name||"Unnamed"} <span class="note">${km(c.d)}</span></li>`).join("")}</ol>`:""}
   <div class="meter"><i style="width:${Math.round(cScore*100)}%"></i></div>
   <p class="note">From OpenStreetMap, which misses some businesses. Check Google Maps for the area too.</p>
   ${k?`<h3>Local market (SCB)</h3>
   <div class="row"><span>Population</span><b>${fmt(k.pop)}</b></div>
   <div class="row"><span>Private cars</span><b>${fmt(k.cars)}</b></div>
   <div class="row"><span>Median net income</span><b>${fmt(k.inc)} kr</b></div>
   <div class="row"><span>House price per m²</span><b>${k.hps?fmt(k.hps)+" kr":"–"}</b></div>
   <div class="row"><span>Municipality score</span><b>${fmt(ks)} of 100</b></div>
   <div class="meter"><i style="width:${Math.round(dScore*100)}%"></i></div>`:""}
   <p class="note" style="margin-top:12px">Site score weighs traffic 40%, competition 35% and the municipality's market 25%. Use it to compare spots, then visit the best ones.</p>`;
}
// Initial help
function help(){if(site)return;$("out").innerHTML=`<h2>Tap any spot to check it</h2><p>Search a town or address, then tap where you'd put the ${BIZ[biz].name}. You'll get passing traffic, nearby competitors and the local market from SCB.</p>
 <div class="key"><span><i class="dot" style="background:#e4002b"></i>${BIZ[biz].mainL}</span><span><i class="dot" style="background:#555"></i>${BIZ[biz].sideL}</span><span><i class="dot" style="background:#1f5fbf"></i>Measured traffic</span></div>
 <div class="key">${["motorway","trunk","primary","secondary","tertiary"].map(k=>`<span><i class="sw" style="background:${ROAD[k].c}"></i>${ROAD[k].l}</span>`).join("")}</div>
 <p class="note">Road colours show typical daily traffic, from heaviest (dark red) to light (yellow). Competitors and roads come live from OpenStreetMap; market data from SCB 2024–2025.</p>`}
// Wiring
let t;map.on("moveend",()=>{clearTimeout(t);t=setTimeout(()=>{loadView();loadTV()},500)});
map.on("click",e=>checkSite([e.latlng.lat,e.latlng.lng]));
$("biz").addEventListener("change",e=>{biz=e.target.value;scoreKom();drawKom();loadComp();if(site)checkSite(site);else help()});
["comp","road","kom","tv"].forEach(k=>$("L-"+k).addEventListener("click",ev=>{
  if(k==="tv"&&!tvKey&&!on.tv){$("tvdlg").showModal();return}
  on[k]=!on[k];ev.currentTarget.classList.toggle("on",on[k]);ev.currentTarget.setAttribute("aria-pressed",on[k]);
  on[k]?G[k].addTo(map):map.removeLayer(G[k]);({comp:loadView,road:loadView,kom:drawKom,tv:loadTV})[k]()}));
$("tvform").addEventListener("submit",e=>{if(e.submitter&&e.submitter.value==="save"){tvKey=$("tvkey").value.trim();try{localStorage.setItem("tvkey",tvKey)}catch(_){}if(tvKey){on.tv=true;$("L-tv").classList.add("on");$("L-tv").setAttribute("aria-pressed","true");G.tv.addTo(map);loadTV()}}});
$("search").addEventListener("submit",async e=>{e.preventDefault();const q=$("q").value.trim();if(!q)return;status("Searching…");
  try{const r=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=se&limit=1&q=${encodeURIComponent(q)}`);const d=await r.json();
    if(!d.length){status("Nothing found. Try a town name or full address.");return}const x=d[0];
    if(x.boundingbox&&(x.type==="administrative"||x.addresstype==="city"||x.addresstype==="town"||x.addresstype==="municipality"))map.fitBounds([[+x.boundingbox[0],+x.boundingbox[2]],[+x.boundingbox[1],+x.boundingbox[3]]]);
    else{map.setView([+x.lat,+x.lon],16);checkSite([+x.lat,+x.lon])}status("")}catch(_){status("Search isn't responding. Try again.")}});
$("handle").addEventListener("click",()=>{$("panel").classList.toggle("min");setTimeout(()=>map.invalidateSize(),50)});
help();loadView();
}
</script>
</body>
</html>
