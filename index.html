<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16181d">
<title>Site Finder · car businesses in Sweden</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,500..800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#16181d;--ink2:#3b3f48;--mut:#737884;--line:#e7e8ec;--soft:#f4f5f7;--card:#fff;--sig:#ff4d2e;--r:16px;--sh:0 10px 30px rgba(16,18,24,.16),0 2px 6px rgba(16,18,24,.08)}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{font:15px/1.45 Inter,system-ui,sans-serif;color:var(--ink);background:#e9eaed;overflow:hidden;-webkit-font-smoothing:antialiased}
#map{position:fixed;inset:0;z-index:0;background:#eef0f2}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sig);outline-offset:2px}
.panel{position:fixed;z-index:500;left:16px;top:16px;bottom:16px;width:392px;display:flex;flex-direction:column;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.top{padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.logo{width:30px;height:30px;border-radius:9px;background:var(--ink);display:grid;place-items:center;flex:none}
.brand b{font-family:Archivo,Inter,sans-serif;font-stretch:110%;font-weight:800;font-size:19px;letter-spacing:-.01em}
.brand span{color:var(--mut);font-size:13px;margin-left:auto}
.search{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:12px;padding:0 6px 0 12px;height:48px}
.search input{flex:1;border:0;background:none;font-size:16px;height:100%;outline:none}
.search button{border:0;background:var(--ink);color:#fff;border-radius:9px;height:36px;padding:0 14px;font-weight:600}
.chips{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;height:36px;padding:0 14px;font-weight:500;font-size:14px;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.body{flex:1;overflow-y:auto;padding:16px;overscroll-behavior:contain}
.status{font-size:13px;color:var(--mut);display:flex;align-items:center;gap:8px;min-height:20px}
.status button{border:1px solid var(--line);background:#fff;border-radius:8px;height:30px;padding:0 10px;font-size:13px}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--ink);animation:sp .8s linear infinite;flex:none;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:12px;align-items:center;margin:4px 0 14px}
.hero h2{font-family:Archivo,Inter,sans-serif;font-stretch:105%;font-weight:800;font-size:22px;line-height:1.15;margin:0}
.hero p{margin:4px 0 0;color:var(--mut);font-size:13px}
.gauge{position:relative;width:92px;height:92px}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge .n{position:absolute;inset:0;display:grid;place-items:center;font-family:Archivo,Inter,sans-serif;font-weight:800;font-size:30px;font-stretch:110%;line-height:1}
.gauge .n small{display:block;font:500 11px Inter,sans-serif;color:var(--mut);text-align:center;margin-top:2px}
.verdict{display:inline-block;margin-top:8px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--soft)}
.facs{display:grid;gap:10px;margin-bottom:6px}
.fac{border:1px solid var(--line);border-radius:12px;padding:12px}
.fac h3{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 8px;font-size:14px;font-weight:600}
.fac h3 em{font-style:normal;font-family:Archivo,Inter,sans-serif;font-weight:800;font-size:17px}
.bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--ink)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:3px 0}
.kv span{color:var(--ink2)}.kv b{font-weight:600;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.near{list-style:none;padding:0;margin:8px 0 0;border-top:1px solid var(--line)}
.near li{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}
.near li span:last-child{color:var(--mut);white-space:nowrap}
.note{font-size:12px;color:var(--mut);margin:8px 0 0}
.skel{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--soft),#e9ebef,var(--soft));background-size:200% 100%;animation:sk 1.2s infinite;margin:6px 0}
@keyframes sk{to{background-position:-200% 0}}
.intro h2{font-family:Archivo,Inter,sans-serif;font-stretch:105%;font-weight:800;font-size:22px;margin:4px 0 6px;line-height:1.15}
.intro p{margin:0 0 14px;color:var(--ink2)}
.steps{display:grid;gap:8px;margin:0 0 16px;padding:0;list-style:none;counter-reset:s}
.steps li{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink2)}
.steps li::before{counter-increment:s;content:counter(s);flex:none;width:22px;height:22px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:600;font-size:12px;color:var(--ink)}
.legend{display:grid;gap:6px;font-size:13px;color:var(--ink2);border-top:1px solid var(--line);padding-top:12px}
.legend div{display:flex;align-items:center;gap:8px}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.15);flex:none}
.ln{width:22px;height:4px;border-radius:2px;flex:none}
.src{font-size:12px;color:var(--mut);margin-top:14px}
.btn{height:42px;border-radius:10px;border:1px solid var(--line);background:#fff;padding:0 14px;font-weight:600}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.layers{position:fixed;z-index:450;top:16px;right:16px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 440px)}
.layers button{border:0;background:#fff;box-shadow:var(--sh);border-radius:999px;height:38px;padding:0 14px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
.layers button i{width:9px;height:9px;border-radius:50%;background:#c9ccd3}
.layers button[aria-pressed=true] i{background:var(--sig)}
.layers #L-kom[aria-pressed=true] i{background:#6d28d9}
.leaflet-left{left:420px}
.leaflet-control-zoom{border:0!important;box-shadow:var(--sh)!important;border-radius:12px!important;overflow:hidden}
.leaflet-control-zoom a{width:40px!important;height:40px!important;line-height:40px!important;border:0!important;color:var(--ink)!important}
.leaflet-container{font:inherit}
.leaflet-popup-content-wrapper{border-radius:12px;box-shadow:var(--sh)}
.leaflet-popup-content{margin:12px 14px;font-size:14px;line-height:1.4}
.spot{position:relative;width:22px;height:22px;border-radius:50%;background:var(--ink);border:4px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.spot::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:2px solid var(--ink);opacity:0;animation:pl 1.8s ease-out infinite}
@keyframes pl{0%{transform:scale(.4);opacity:.7}100%{transform:scale(1.4);opacity:0}}
.layers .tl-btn svg{flex:none}
.layers .tl-btn[aria-pressed=true]{background:var(--ink);color:#fff}
.toplist{position:fixed;z-index:460;left:424px;right:16px;bottom:16px;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:12px}
.toplist[hidden]{display:none}
.tl-head{display:flex;align-items:center;gap:10px;padding:0 2px 10px}
.tl-head b{font-family:Archivo,Inter,sans-serif;font-stretch:105%;font-weight:800;font-size:16px;white-space:nowrap}
.tl-head span{color:var(--mut);font-size:13px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-head button{flex:none;border:0;background:var(--soft);border-radius:8px;width:32px;height:32px;display:grid;place-items:center}
.tl-row{display:flex;gap:8px;overflow-x:auto;list-style:none;margin:0;padding:0 0 4px;scroll-snap-type:x proximity;overscroll-behavior-x:contain}
.tl-row li{flex:none;width:250px;scroll-snap-align:start}
.tl-card{width:100%;height:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;align-items:center}
.tl-card:hover{border-color:#c9ccd3}
.tl-card[aria-current=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.tl-n,.tl-pin{width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-weight:700;font-size:12px;display:grid;place-items:center}
.tl-n{grid-row:span 2}
.tl-pin{border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35);width:26px;height:26px}
.tl-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-meta{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-s{grid-row:span 2;font-family:Archivo,Inter,sans-serif;font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.tl-empty{font-size:14px;color:var(--mut);padding:6px 2px 10px}
body.tl-open .leaflet-bottom{bottom:150px}
.handle{display:none}
dialog{border:0;border-radius:var(--r);box-shadow:var(--sh);max-width:min(92vw,440px);padding:20px}
dialog::backdrop{background:rgba(16,18,24,.45)}
dialog h2{font-family:Archivo,Inter,sans-serif;font-weight:800;margin:0 0 8px;font-size:20px}
dialog input{width:100%;height:46px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:16px}
@media(min-width:761px){.search-float{display:contents}}
@media(max-width:760px){
 .panel{left:0;right:0;top:auto;bottom:0;width:auto;height:46vh;border-radius:20px 20px 0 0;transition:height .28s ease;padding-bottom:env(safe-area-inset-bottom)}
 .panel.peek{height:150px}
 .panel.full{height:calc(100% - 76px)}
 .handle{display:block;border:0;background:none;width:100%;height:24px;padding:0;flex:none}
 .handle::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:#d3d5db;margin:8px auto 0}
 .top{padding:2px 16px 10px}
 .chips{margin-top:0}
 .brand{display:none}
 .search-float{position:fixed;z-index:520;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top))}
 .search-float .search{background:#fff;box-shadow:var(--sh)}
 .layers{top:calc(68px + env(safe-area-inset-top));right:10px;left:auto;max-width:none;flex-direction:column;align-items:flex-end}
 .layers button{height:34px;padding:0 11px;font-size:12px}
 .leaflet-left{left:0}
 .leaflet-top.leaflet-left{top:calc(58px + env(safe-area-inset-top))}
 .leaflet-bottom{bottom:46vh}
 body:has(.panel.peek) .leaflet-bottom{bottom:150px}
 .toplist{left:8px;right:8px;bottom:calc(46vh + 8px);padding:10px}
 body:has(.panel.peek) .toplist{bottom:158px}
 body:has(.panel.full) .toplist{display:none}
 .tl-row li{width:232px}
 .tl-card{padding:9px 10px;gap:2px 8px}
 .tl-s{font-size:17px}
 body.tl-open .leaflet-bottom{bottom:calc(46vh + 130px)}
 body.tl-open:has(.panel.peek) .leaflet-bottom{bottom:280px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="map" aria-label="Map"></div>

<div class="panel" id="panel">
  <button class="handle" id="handle" aria-label="Resize panel"></button>
  <div class="top">
    <div class="brand"><div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg></div><b>Site Finder</b><span id="upd"></span></div>
    <div class="search-float"><form class="search" id="search" role="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#737884" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input type="search" id="q" placeholder="Search address or town" aria-label="Search address or town" autocomplete="off" enterkeyhint="search"><button>Go</button></form></div>
    <div class="chips" role="group" aria-label="Business type" id="biz"></div>
  </div>
  <div class="body" id="body">
    <div class="status" id="status" role="status"></div>
    <div id="out"></div>
  </div>
</div>

<div class="layers" role="group" aria-label="Map layers">
  <button id="L-comp" aria-pressed="true"><i></i>Competitors</button>
  <button id="L-kom" aria-pressed="false"><i></i>Market heat</button>
  <button id="L-tv" aria-pressed="false"><i></i>Live traffic</button>
  <button id="L-top" class="tl-btn" aria-pressed="false" aria-controls="toplist"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>Top spots</button>
</div>

<section class="toplist" id="toplist" hidden aria-labelledby="tl-title">
  <div class="tl-head"><b id="tl-title">Top spots in view</b><span id="tl-sub"></span><button id="tl-close" aria-label="Close top spots"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <ol class="tl-row" id="tl-row"></ol>
</section>

<dialog id="tvdlg">
  <h2>Live traffic counts</h2>
  <p>Live counts come from Trafikverket's open API, which needs a free key. Register at <b>api.trafikinfo.trafikverket.se</b>, create a key and paste it here. It's saved only in this browser.</p>
  <form method="dialog" id="tvform" style="display:grid;gap:10px">
    <input id="tvkey" placeholder="API key" autocomplete="off" aria-label="Trafikverket API key">
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn pri" value="save">Save</button></div>
  </form>
</dialog>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
{
const $=id=>document.getElementById(id);
const fmt=n=>n==null||isNaN(n)?"–":Math.round(n).toLocaleString("sv-SE");
const km=m=>m<1000?Math.round(m/10)*10+" m":(m/1000).toFixed(1).replace(".",",")+" km";
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const phone=()=>innerWidth<=760;
const OVERPASS=["https://overpass-api.de/api/interpreter","https://overpass.private.coffee/api/interpreter","https://maps.mail.ru/osm/tools/overpass/api/interpreter"];
const BIZ={
 tyre:{label:"Tyre shop",name:"tyre shop",main:"t",side:"r",mainL:"Tyre shops",sideL:"Garages",sideNote:"many also fit tyres"},
 mech:{label:"Car mechanic",name:"garage",main:"r",side:"t",mainL:"Garages",sideL:"Tyre shops",sideNote:""},
 wash:{label:"Car wash",name:"car wash",main:"w",side:"",mainL:"Car washes",sideL:"",sideNote:""}};
const ROAD={motorway:{l:"Motorway",adt:"20 000–80 000",v:1,c:"#9b1030",w:6},trunk:{l:"Major road",adt:"8 000–30 000",v:.85,c:"#e0262f",w:5},
 primary:{l:"Main road",adt:"4 000–15 000",v:.7,c:"#ff7a2f",w:4.5},secondary:{l:"Secondary road",adt:"1 500–6 000",v:.5,c:"#ffb02e",w:3.5},
 tertiary:{l:"Local through-road",adt:"500–3 000",v:.3,c:"#ffd666",w:2.5},residential:{l:"Residential street",adt:"under 500",v:.1,c:"#c4c7cf",w:1.5},unclassified:{l:"Minor road",adt:"under 500",v:.12,c:"#c4c7cf",w:1.5}};
["motorway","trunk","primary","secondary","tertiary"].forEach(k=>ROAD[k+"_link"]={...ROAD[k],l:ROAD[k].l+" ramp",v:ROAD[k].v*.8});
let biz="tyre",site=null,tvKey="",POI=null;try{tvKey=localStorage.getItem("tvkey")||""}catch(e){}
const on={comp:true,kom:false,tv:false};
const status=(t,busy)=>{$("status").innerHTML=t?(busy?'<span class="spin"></span>':"")+esc(t):""};

const map=L.map("map",{zoomControl:false,preferCanvas:true}).setView([62.4,16.3],5);
L.control.zoom({position:"topleft"}).addTo(map);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);
const G={kom:L.layerGroup(),road:L.layerGroup().addTo(map),comp:L.layerGroup().addTo(map),tv:L.layerGroup(),site:L.layerGroup().addTo(map),top:L.layerGroup().addTo(map)};
const renderer=L.canvas({padding:.3});
// Market heat gets its own pane and canvas below everything else, so it never covers competitor dots
map.createPane("heat").style.zIndex=350;const heatRenderer=L.canvas({padding:.3,pane:"heat"});

// Overpass: one request at a time, 15 s per server, then the next server
let opChain=Promise.resolve();
async function opOnce(q){let err;for(const u of OVERPASS){const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),15000);
  try{const r=await fetch(u,{method:"POST",body:"data="+encodeURIComponent(q),headers:{"Content-Type":"application/x-www-form-urlencoded"},signal:ac.signal});clearTimeout(tm);
    if(r.ok){const d=await r.json();if(d&&d.elements)return d}err=new Error("HTTP "+r.status)}catch(e){clearTimeout(tm);err=e}}throw err}
function overpass(q){const run=opChain.then(()=>opOnce(q));opChain=run.catch(()=>{});return run}

// Competitors: nationwide file (refreshed weekly); falls back to a live query per view
function kindsOf(t){let k="";if(t.shop==="tyres"||t["service:vehicle:tyres"]==="yes")k+="t";if(t.shop==="car_repair"||t.craft==="car_repair")k+="r";if(t.amenity==="car_wash")k+="w";return k}
const fromOSM=els=>{const seen=new Set();return els.filter(e=>{const id=e.type+e.id;if(seen.has(id)||!e.tags||e.tags.highway)return false;seen.add(id);return true}).map(e=>{const t=e.tags,lat=e.lat??e.center?.lat,lon=e.lon??e.center?.lon;const st=[t["addr:street"],t["addr:housenumber"]].filter(Boolean).join(" ");return[lat,lon,kindsOf(t),t.name||"",[st,t["addr:city"]].filter(Boolean).join(", ")]}).filter(r=>r[2]&&r[0]!=null)};
const role=k=>k.includes(BIZ[biz].main)?"main":BIZ[biz].side&&k.includes(BIZ[biz].side)?"side":null;
let liveCache=new Map(),gen=0;
async function drawComp(){
  const my=++gen;G.comp.clearLayers();if(!on.comp)return;
  if(map.getZoom()<9){if(!site)status("Zoom in on a town to see competitors.");return}
  let pts=POI;const b=map.getBounds().pad(.2);
  if(POI===null){status("Loading competitors…",true);return}
  if(POI===false){
    if(map.getZoom()<11){if(!site)status("Zoom in closer to load competitors.");return}
    const bb=[b.getSouth(),b.getWest(),b.getNorth(),b.getEast()].map(x=>x.toFixed(3)).join(",");
    if(!liveCache.has(bb)){status("Loading competitors…",true);try{liveCache.set(bb,fromOSM((await overpass(`[out:json][timeout:25];(nwr["shop"~"^(tyres|car_repair)$"](${bb});nwr["craft"="car_repair"](${bb});nwr["amenity"="car_wash"](${bb}););out center tags;`)).elements))}catch(e){if(my===gen)retry("The map-data server is busy.",drawComp);return}}
    if(my!==gen)return;pts=liveCache.get(bb)}
  let nm=0,ns=0;
  pts.forEach(r=>{if(!b.contains([r[0],r[1]]))return;const ro=role(r[2]);if(!ro)return;ro==="main"?nm++:ns++;
    const m=L.circleMarker([r[0],r[1]],{renderer,radius:ro==="main"?7:4.5,color:"#fff",weight:2,fillColor:ro==="main"?"#ff4d2e":"#5b6170",fillOpacity:1});
    m.bindPopup(`<b>${esc(r[3])||"Unnamed"}</b><br><span style="color:#737884">${ro==="main"?BIZ[biz].mainL.slice(0,-1):BIZ[biz].sideL.slice(0,-1)}${r[4]?" · "+esc(r[4]):""}</span>`);m.addTo(G.comp)});
  if(!site)status(`${nm} ${BIZ[biz].mainL.toLowerCase()}${BIZ[biz].side?` and ${ns} ${BIZ[biz].sideL.toLowerCase()}`:""} in view`);
}
function retry(msg,fn){$("status").innerHTML=`${esc(msg)} <button id="rt">Try again</button>`;$("rt").onclick=fn}
fetch("competitors.json",{cache:"no-cache"}).then(r=>r.ok?r.json():Promise.reject()).then(d=>{POI=d.c;$("upd").textContent="Data "+d.updated;drawComp();scoreKom();drawKom();if(site)checkSite(site)}).catch(()=>{POI=false;drawComp()});

// Market heat: SCB neighbourhoods (DeSO, ~6 160 areas) scored on cars within 3 km,
// cars per competitor, income and the municipality's house prices
let kom=null,deso=null,desoScore={},komByCode={};
function pctFn(vals,inv){const v=vals.filter(x=>x!=null).sort((a,b)=>a-b);return x=>{if(x==null)return .5;let lo=0,hi=v.length;while(lo<hi){const m=(lo+hi)>>1;v[m]<x?lo=m+1:hi=m}const p=lo/(v.length-1);return inv?1-p:p}}
function scoreKom(){if(!deso)return;const P=deso.features.map(f=>f.properties);
  const grid=new Map(),cell=r=>Math.floor(r[0]/.03)+","+Math.floor(r[1]/.09);
  if(POI)POI.forEach(r=>{if(role(r[2])!=="main")return;const k=cell(r);(grid.get(k)||grid.set(k,[]).get(k)).push(r)});
  P.forEach(p=>{let n=0;const gy=Math.floor(p.lat/.03),gx=Math.floor(p.lon/.09);
    for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++)(grid.get((gy+a)+","+(gx+b))||[]).forEach(r=>{if(dist([p.lat,p.lon],[r[0],r[1]])<=3000)n++});
    p.comp3=n;p.gap=p.cars3/(1+n);const k=komByCode[p.k];p.hps=k?k.hps:null});
  const W=biz==="wash"?{cars3:3,gap:3,inc:4,cost:1}:biz==="mech"?{cars3:4,gap:4,inc:1,cost:3}:{cars3:4,gap:4,inc:2,cost:2};
  if(!POI)delete W.gap;
  const f={cars3:pctFn(P.map(p=>p.cars3)),gap:pctFn(P.map(p=>p.gap)),inc:pctFn(P.map(p=>p.inc)),cost:pctFn(P.map(p=>p.hps),true)};
  const raw=P.map(p=>{let s=0,t=0;for(const k in W){s+=W[k]*f[k](k==="cost"?p.hps:p[k]);t+=W[k]}return s/t});
  const rank=pctFn(raw);P.forEach((p,i)=>desoScore[p.c]=rank(raw[i])*100);drawTop()}
function drawKom(){G.kom.clearLayers();if(!on.kom||!deso)return;L.geoJSON(deso,{renderer:heatRenderer,pane:"heat",interactive:false,style:f=>{const t=(desoScore[f.properties.c]||0)/100;return{stroke:false,fillColor:"#6d28d9",fillOpacity:.02+t*t*.5}}}).addTo(G.kom)}
function inPoly(pt,ring){let x=pt[1],y=pt[0],c=false;for(let i=0,j=ring.length-1;i<ring.length;j=i++){const[xi,yi]=ring[i],[xj,yj]=ring[j];if((yi>y)!=(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)c=!c}return c}
const areaAt=(fc,p)=>fc?fc.features.find(f=>f.geometry.coordinates.some(poly=>inPoly(p,poly[0])))?.properties||null:null;
const komAt=p=>areaAt(kom,p),desoAt=p=>areaAt(deso,p);
fetch("kommuner.json").then(r=>r.json()).then(d=>{kom=d;d.features.forEach(f=>komByCode[f.properties.c]=f.properties);scoreKom();drawKom();if(site)checkSite(site)}).catch(()=>{});
fetch("deso.json").then(r=>r.json()).then(d=>{deso=d;scoreKom();drawKom();if(site)checkSite(site)}).catch(()=>{});

// Top spots: the best-scoring neighbourhoods in the current view, spread apart
// The part of the map not hidden behind the panel, search bar or the list itself
function visibleBounds(){const m=map.getContainer().getBoundingClientRect(),pr=$("panel").getBoundingClientRect(),tr=$("toplist").getBoundingClientRect();
  let x0=0,y0=0,x1=m.width,y1=m.height;
  if(phone()){y0=70;y1=Math.min(pr.top,topOpen?tr.top:pr.top)-8}else{x0=pr.right+8;if(topOpen)y1=tr.top-8}
  if(x1-x0<80||y1-y0<80)return map.getBounds();
  return L.latLngBounds(map.containerPointToLatLng([x0+16,y1-40]),map.containerPointToLatLng([x1-16,y0+20]))}
let topOpen=false,topSel=null,topGen=0;const placeName=new Map();
function drawTop(){G.top.clearLayers();if(!topOpen)return;const row=$("tl-row"),B=BIZ[biz];
  $("tl-sub").textContent="for a "+B.name+", by local market score";
  if(!deso){row.innerHTML='<li class="tl-empty">Loading market data…</li>';return}
  const b=visibleBounds(),diag=map.distance(b.getNorthWest(),b.getSouthEast()),gap=Math.max(800,diag/20);
  const cand=deso.features.map(f=>f.properties).filter(p=>b.contains([p.lat,p.lon])&&p.pop>0).sort((a,c)=>desoScore[c.c]-desoScore[a.c]);
  const top=[];for(const p of cand){if(top.every(q=>dist([p.lat,p.lon],[q.lat,q.lon])>=gap))top.push(p);if(top.length===10)break}
  if(!top.length){row.innerHTML='<li class="tl-empty">No neighbourhoods in view. Zoom out or move the map.</li>';return}
  const name=p=>placeName.get(p.c)||(komByCode[p.k]?komByCode[p.k].n:"Area "+p.c);
  row.innerHTML=top.map((p,i)=>`<li><button class="tl-card" data-i="${i}" aria-current="${topSel===p.c}"><span class="tl-n">${i+1}</span><span class="tl-name" id="tln-${esc(p.c)}">${esc(name(p))}</span><span class="tl-s">${Math.round(desoScore[p.c])}</span><span class="tl-meta">${fmt(p.cars3)} cars · ${POI?p.comp3+" "+(p.comp3===1?B.name:B.mainL.toLowerCase()):"–"} in 3 km</span></button></li>`).join("");
  row.querySelectorAll(".tl-card").forEach(el=>el.addEventListener("click",()=>pickTop(top[+el.dataset.i])));
  top.forEach((p,i)=>L.marker([p.lat,p.lon],{icon:L.divIcon({className:"",html:`<div class="tl-pin">${i+1}</div>`,iconSize:[26,26],iconAnchor:[13,13]}),title:name(p),zIndexOffset:500}).on("click",()=>pickTop(p)).addTo(G.top));
  nameTop(top,++topGen)}
function pickTop(p){topSel=p.c;$("tl-row").querySelectorAll(".tl-card").forEach(el=>el.setAttribute("aria-current",el.querySelector(".tl-name").id==="tln-"+p.c));checkSite([p.lat,p.lon])}
// street-level names from OpenStreetMap, one request per second as its usage policy asks
async function nameTop(top,my){for(const p of top){if(placeName.has(p.c))continue;await new Promise(r=>setTimeout(r,1100));if(my!==topGen)return;
  try{const g=await(await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=16&lat=${p.lat}&lon=${p.lon}`)).json();const a=g&&g.address||{};
    const here=a.suburb||a.neighbourhood||a.quarter||a.city_district||a.village||a.hamlet||a.road,town=a.city||a.town||a.municipality||(komByCode[p.k]||{}).n;
    const n=[here,town].filter((x,i,arr)=>x&&arr.indexOf(x)===i).join(", ");if(n){placeName.set(p.c,n);const el=document.getElementById("tln-"+p.c);if(el)el.textContent=n}}catch(e){}}}
function setTop(v){topOpen=v;$("L-top").setAttribute("aria-pressed",v);$("toplist").hidden=!v;document.body.classList.toggle("tl-open",v);
  if(v&&phone()){panel.classList.remove("full");panel.classList.add("peek")}drawTop()}

// Trafikverket live flow
async function loadTV(){G.tv.clearLayers();if(!on.tv||!tvKey)return;if(map.getZoom()<9){status("Zoom in to see live traffic sensors.");return}
  const b=map.getBounds();const xml=`<REQUEST><LOGIN authenticationkey="${tvKey.replace(/[^\w-]/g,"")}"/><QUERY objecttype="TrafficFlow" schemaversion="1.4" limit="500"><FILTER><WITHIN name="Geometry.WGS84" shape="box" value="${b.getWest()} ${b.getSouth()}, ${b.getEast()} ${b.getNorth()}"/></FILTER></QUERY></REQUEST>`;
  try{const r=await fetch("https://api.trafikinfo.trafikverket.se/v2/data.json",{method:"POST",headers:{"Content-Type":"text/xml"},body:xml});const d=await r.json();
    const res=d?.RESPONSE?.RESULT?.[0];if(res?.ERROR)throw new Error(res.ERROR.MESSAGE);const S=new Map();
    (res?.TrafficFlow||[]).forEach(i=>{const m=/POINT \(([-\d.]+) ([-\d.]+)\)/.exec(i.Geometry?.WGS84||"");if(!m)return;const k=i.SiteId||m[0];const o=S.get(k)||{p:[+m[2],+m[1]],flow:0,spd:i.AverageVehicleSpeed,t:i.MeasurementTime};o.flow+=+i.VehicleFlowRate||0;S.set(k,o)});
    S.forEach(s=>L.circleMarker(s.p,{renderer,radius:6+Math.min(10,s.flow/400),color:"#fff",weight:2,fillColor:"#2563eb",fillOpacity:.9}).bindPopup(`<b>${fmt(s.flow)} vehicles/hour</b> now<br>Avg speed ${fmt(s.spd)} km/h<br><span style="color:#737884">Trafikverket sensor</span>`).addTo(G.tv));
    status(S.size?`${S.size} live traffic sensors in view`:"No Trafikverket sensors here. They're mostly on big roads near larger cities.");
  }catch(e){status("Trafikverket didn't accept the key. Tap Live traffic to change it.")}}

// Site check
const dist=(a,b)=>{const R=6371e3,r=Math.PI/180,dl=(b[0]-a[0])*r,dn=(b[1]-a[1])*r;const h=Math.sin(dl/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
function segDist(p,a,b){const k=Math.cos(p[0]*Math.PI/180),ax=(a[1]-p[1])*k,ay=a[0]-p[0],bx=(b[1]-p[1])*k,by=b[0]-p[0],dx=bx-ax,dy=by-ay;const t=Math.max(0,Math.min(1,-(ax*dx+ay*dy)/((dx*dx+dy*dy)||1e-12)));return Math.hypot(ax+t*dx,ay+t*dy)*111320}
const gauge=v=>{const c=2*Math.PI*40,col=v>=70?"#16a34a":v>=50?"#f59e0b":"#ff4d2e";return `<div class="gauge"><svg viewBox="0 0 92 92"><circle cx="46" cy="46" r="40" fill="none" stroke="#f0f1f4" stroke-width="9"/><circle cx="46" cy="46" r="40" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c*v/100} ${c}"/></svg><div class="n"><div>${v}<small>of 100</small></div></div></div>`};
const verdict=v=>v>=70?["Strong spot","#dcfce7","#166534"]:v>=50?["Worth a look","#fef3c7","#92400e"]:["Weak spot","#ffe4e0","#9f1d0b"];
const bar=v=>`<div class="bar"><i style="width:${Math.round(v*100)}%"></i></div>`;
let roadCache=new Map(),siteGen=0;
async function checkSite(p){
  const my=++siteGen;site=p;G.site.clearLayers();G.road.clearLayers();
  [3000,1000].forEach((r,i)=>L.circle(p,{radius:r,color:"#16181d",weight:1.2,opacity:.5,fill:i===1,fillColor:"#16181d",fillOpacity:.04,dashArray:"3 6",interactive:false}).addTo(G.site));
  L.marker(p,{icon:L.divIcon({className:"",html:'<div class="spot"></div>',iconSize:[22,22],iconAnchor:[11,11]}),interactive:false}).addTo(G.site);
  openPanel();status("");
  if(phone())setTimeout(()=>{const H=map.getSize().y,y=map.latLngToContainerPoint(p).y,vis=H-panel.getBoundingClientRect().height;if(y>vis-70||y<90)map.panBy([0,y-Math.min(H*.28,vis*.5)])},320);
  const B=BIZ[biz],k=komAt(p),dz=desoAt(p),ks=dz?desoScore[dz.c]:null;
  let comps=null,cur=null,place="",tstate="wait";
  if(POI)comps=POI.filter(r=>Math.abs(r[0]-p[0])<.05&&Math.abs(r[1]-p[1])<.1).map(r=>({r,d:dist(p,[r[0],r[1]]),ro:role(r[2])})).filter(x=>x.ro&&x.d<=3000).sort((a,b)=>a.d-b.d);
  const render=()=>{
    if(my!==siteGen)return;
    const main=comps?comps.filter(c=>c.ro==="main"):[],side=comps?comps.filter(c=>c.ro==="side"):[];
    const m1=main.filter(c=>c.d<=1000).length,m3=main.length;
    let best=null;(cur||[]).forEach(x=>{const eff=x.r.v*(x.d<=60?1:x.d<=150?.6:.3);if(!best||eff>best.eff)best={...x,eff}});
    const tS=cur?(best?best.eff:0):null,cS=comps?Math.max(0,1-(m1*.25+m3*.07)):null,dS=ks!=null?ks/100:null;
    const parts=[[tS,.4],[cS,.35],[dS,.25]].filter(x=>x[0]!=null),tot=parts.reduce((a,x)=>a+x[1],0);
    const done=tstate!=="wait"&&comps;
    const score=done&&parts.length?Math.round(parts.reduce((a,x)=>a+x[0]*x[1],0)/tot*100):null;
    const [vt,vb,vc]=score!=null?verdict(score):["Checking traffic…","#f4f5f7","#737884"];
    $("out").innerHTML=`
    <div class="hero"><div><h2>${esc(place)||"Selected spot"}</h2><p>${k?esc(k.n)+" · ":""}scored as a ${B.name}</p><span class="verdict" style="background:${vb};color:${vc}">${vt}</span></div>${score!=null?gauge(score):'<div class="gauge"><div class="n"><span class="spin" style="width:22px;height:22px;border-width:3px"></span></div></div>'}</div>
    <div class="facs">
    <section class="fac"><h3>Passing traffic <em>${tS!=null?Math.round(tS*100):"…"}</em></h3>
      ${tstate==="wait"?'<div class="skel"></div><div class="skel" style="width:70%"></div>':tstate==="fail"?`<p class="note" style="margin:0">The traffic check timed out. <button class="btn" id="again" style="height:32px;margin-left:6px">Retry</button></p>`:
      bar(tS)+(best?`<div class="kv"><span>Busiest road nearby</span><b>${esc(best.t.name||best.t.ref||best.r.l)}</b></div><div class="kv"><span>Road type</span><b>${best.r.l}${best.t.ref&&best.t.name?" · "+esc(best.t.ref):""}</b></div><div class="kv"><span>Typical traffic</span><b>${best.r.adt} / day</b></div><div class="kv"><span>Distance</span><b>${km(best.d)}</b></div>`:`<div class="kv"><span>No through-roads within 300 m</span><b>Low</b></div>`)+`<p class="note">A typical range for this road type, not a count. The coloured roads on the map show traffic levels around the spot.</p>`}
    </section>
    <section class="fac"><h3>Competition <em>${cS!=null?Math.round(cS*100):"…"}</em></h3>
      ${comps?bar(cS)+`<div class="kv"><span>${B.mainL} within 1 km</span><b>${m1}</b></div><div class="kv"><span>${B.mainL} within 3 km</span><b>${m3}</b></div>${B.side?`<div class="kv"><span>${B.sideL} within 3 km</span><b>${side.length}</b></div>`:""}<div class="kv"><span>Nearest ${B.name}</span><b>${main[0]?km(main[0].d):"none in 3 km"}</b></div>
      ${main.length?`<ul class="near">${main.slice(0,5).map(c=>`<li><span>${esc(c.r[3])||"Unnamed"}</span><span>${km(c.d)}</span></li>`).join("")}</ul>`:""}<p class="note">From OpenStreetMap, which misses some small workshops.${B.sideNote?" "+B.sideL+" are counted separately because "+B.sideNote+".":""}</p>`:'<div class="skel"></div><div class="skel" style="width:60%"></div>'}
    </section>
    ${dz?`<section class="fac"><h3>Local market · SCB <em>${Math.round(ks)}</em></h3>${bar(ks/100)}
      <div class="kv"><span>Cars within 3 km</span><b>${fmt(dz.cars3)}</b></div><div class="kv"><span>People within 3 km</span><b>${fmt(dz.pop3)}</b></div>${POI?`<div class="kv"><span>Cars per ${B.name} within 3 km</span><b>${fmt(dz.gap)}</b></div>`:""}<div class="kv"><span>Cars per 1 000 people here</span><b>${fmt(dz.cars/dz.pop*1000)}</b></div><div class="kv"><span>Average net income here</span><b>${fmt(dz.inc*1000)} kr</b></div><div class="kv"><span>House price per m² (municipality)</span><b>${k&&k.hps?fmt(k.hps)+" kr":"–"}</b></div>
      <p class="note">Neighbourhood ${esc(dz.c)}, compared with all 6 160 SCB neighbourhoods in Sweden. Darker purple on the Market heat layer means a stronger market.</p></section>`:""}
    </div>
    <p class="note">The site score weighs traffic 40%, competition 35% and local market 25%.</p>`;
    const ag=$("again");if(ag)ag.onclick=()=>checkSite(p);
  };
  render();
  fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&lat=${p[0]}&lon=${p[1]}`).then(x=>x.json()).then(g=>{if(g&&g.address){const a=g.address;place=[[a.road,a.house_number].filter(Boolean).join(" "),a.city||a.town||a.village||a.municipality].filter(Boolean).join(", ");render()}}).catch(()=>{});
  const key=p.map(x=>x.toFixed(4)).join();
  const roadQ=`[out:json][timeout:20];(way["highway"~"^(motorway|trunk|primary|secondary|tertiary|motorway_link|trunk_link|primary_link|secondary_link|residential|unclassified)$"](around:300,${p[0]},${p[1]});way["highway"~"^(motorway|trunk|primary|secondary|tertiary)$"](around:1500,${p[0]},${p[1]}););out geom tags;`;
  const compQ=`[out:json][timeout:25];(nwr["shop"~"^(tyres|car_repair)$"](around:3000,${p[0]},${p[1]});nwr["craft"="car_repair"](around:3000,${p[0]},${p[1]});nwr["amenity"="car_wash"](around:3000,${p[0]},${p[1]}););out center tags;`;
  try{const d=roadCache.get(key)||await overpass(roadQ);roadCache.set(key,d);
    if(my!==siteGen)return;
    d.elements.forEach(w=>{const r=ROAD[w.tags&&w.tags.highway];if(r&&w.geometry&&r.v>=.3)L.polyline(w.geometry.map(g=>[g.lat,g.lon]),{renderer,color:r.c,weight:r.w,opacity:.9,interactive:false}).addTo(G.road)});
    cur=d.elements.filter(w=>w.tags&&ROAD[w.tags.highway]&&w.geometry).map(w=>{let dd=1e9;for(let i=1;i<w.geometry.length;i++){const a=w.geometry[i-1],b=w.geometry[i];dd=Math.min(dd,segDist(p,[a.lat,a.lon],[b.lat,b.lon]))}return{t:w.tags,r:ROAD[w.tags.highway],d:dd}}).filter(x=>x.d<=300);
    tstate="ok";
  }catch(e){tstate="fail"}
  if(!comps){try{comps=fromOSM((await overpass(compQ)).elements).map(r=>({r,d:dist(p,[r[0],r[1]]),ro:role(r[2])})).filter(x=>x.ro).sort((a,b)=>a.d-b.d)}catch(e){comps=[]}}
  render();
}

function intro(){if(site)return;const B=BIZ[biz];$("out").innerHTML=`<div class="intro"><h2>Find the best spot for your ${B.name}</h2><p>Every ${B.name} in Sweden is on the map. Check any address to see passing traffic, nearby competition and the local market.</p>
 <ol class="steps"><li>Search a town or address</li><li>Tap where you'd open</li><li>Compare the scores of a few spots</li></ol>
 <div class="legend"><div><i class="dot" style="background:#ff4d2e"></i>${B.mainL}</div>${B.side?`<div><i class="dot" style="background:#5b6170;width:9px;height:9px"></i>${B.sideL}${B.sideNote?" ("+B.sideNote+")":""}</div>`:""}
 <div><i class="ln" style="background:linear-gradient(90deg,#9b1030,#e0262f,#ff7a2f,#ffb02e,#ffd666)"></i>Traffic around a checked spot, heavy to light</div></div>
 <p class="src">Competitors: OpenStreetMap. Market: SCB 2024–2025 neighbourhood data (cars, population, income) and municipal property prices.</p></div>`}

const panel=$("panel");
function openPanel(){if(phone()&&panel.classList.contains("peek"))panel.classList.remove("peek")}
function cycle(up){if(up){panel.classList.contains("peek")?panel.classList.remove("peek"):panel.classList.add("full")}else{panel.classList.contains("full")?panel.classList.remove("full"):panel.classList.add("peek")}}
$("handle").addEventListener("click",()=>cycle(panel.classList.contains("peek")||!panel.classList.contains("full")));
let ty=null;$("handle").addEventListener("touchstart",e=>ty=e.touches[0].clientY,{passive:true});
$("handle").addEventListener("touchend",e=>{if(ty==null)return;const dy=e.changedTouches[0].clientY-ty;ty=null;if(Math.abs(dy)<25)return;e.preventDefault();cycle(dy<0)});

$("biz").innerHTML=Object.entries(BIZ).map(([k,v])=>`<button class="chip" data-b="${k}" aria-pressed="${k===biz}">${v.label}</button>`).join("");
$("biz").addEventListener("click",e=>{const b=e.target.closest("[data-b]");if(!b)return;biz=b.dataset.b;document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c.dataset.b===biz));scoreKom();drawKom();drawComp();site?checkSite(site):intro()});
let t;map.on("moveend",()=>{clearTimeout(t);t=setTimeout(()=>{drawComp();loadTV();drawTop()},250)});
map.on("click",e=>checkSite([e.latlng.lat,e.latlng.lng]));
["comp","kom","tv"].forEach(k=>$("L-"+k).addEventListener("click",ev=>{
  if(k==="tv"&&!tvKey&&!on.tv){$("tvkey").value="";$("tvdlg").showModal();return}
  on[k]=!on[k];ev.currentTarget.setAttribute("aria-pressed",on[k]);on[k]?G[k].addTo(map):map.removeLayer(G[k]);({comp:drawComp,kom:drawKom,tv:loadTV})[k]()}));
$("tvform").addEventListener("submit",e=>{if(e.submitter&&e.submitter.value==="save"){tvKey=$("tvkey").value.trim();try{localStorage.setItem("tvkey",tvKey)}catch(_){}if(tvKey){on.tv=true;$("L-tv").setAttribute("aria-pressed","true");G.tv.addTo(map);loadTV()}}});
$("search").addEventListener("submit",async e=>{e.preventDefault();$("q").blur();const q=$("q").value.trim();if(!q)return;status("Searching…",true);
  try{const r=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=se&limit=1&q=${encodeURIComponent(q)}`);const d=await r.json();
    if(!d.length){status("Nothing found. Try a town name or a full address.");return}const x=d[0];status("");
    const area=["city","town","municipality","county","state","village","suburb"].includes(x.addresstype)||x.type==="administrative";
    if(area&&x.boundingbox){site=null;siteGen++;G.site.clearLayers();G.road.clearLayers();map.fitBounds([[+x.boundingbox[0],+x.boundingbox[2]],[+x.boundingbox[1],+x.boundingbox[3]]],{paddingTopLeft:phone()?[0,60]:[420,0]});intro();if(phone())panel.classList.add("peek")}
    else{map.setView([+x.lat,+x.lon],16);checkSite([+x.lat,+x.lon])}}catch(_){status("Search isn't answering. Try again.")}});
$("L-top").addEventListener("click",()=>setTop(!topOpen));$("tl-close").addEventListener("click",()=>{setTop(false);$("L-top").focus()});
if(phone())panel.classList.add("peek");
intro();
}
</script>
</body>
</html>
